<!-- R.A.L.F. – Kontakt Test | contact-test.html -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt – R.A.L.F.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <!-- Kopf -->
  <header class="p-6 border-b border-orange-600">
    <h1 class="text-2xl font-extrabold tracking-tight">Kontakt</h1>
    <p class="mt-2 text-neutral-300 max-w-2xl">
      Hier könnt ihr mir Feedback, Fehlerberichte oder Anfragen schicken –
      zum Beispiel, wenn ihr meine Musik gewerblich nutzen wollt.
    </p>
  </header>

  <!-- Formular -->
  <main class="max-w-3xl mx-auto p-6">
    <form id="contactForm" class="card p-4 sm:p-6 space-y-4"
          action="https://formsubmit.co/ralf.music68@gmail.com"
          method="POST" novalidate>

      <!-- Kategorie -->
      <div>
        <label for="category" class="block text-sm mb-1">Kategorie</label>
        <select id="category" name="category"
                class="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2">
          <option value="Bug">Fehler melden</option>
          <option value="Feedback">Feedback geben</option>
          <option value="Lizenz">Lizenz / gewerbliche Anfrage</option>
        </select>
      </div>

      <!-- Betreff -->
      <div>
        <label for="subject" class="block text-sm mb-1">Betreff (optional)</label>
        <input type="text" id="subject" name="subject"
               class="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2" />
      </div>

      <!-- Nachricht -->
      <div>
        <label for="message" class="block text-sm mb-1">Nachricht</label>
        <textarea id="message" name="message" required rows="6"
                  class="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2"></textarea>
      </div>

      <!-- Antwort-E-Mail -->
      <div>
        <label for="reply_to" class="block text-sm mb-1">Deine E-Mail für Antwort</label>
        <input type="email" name="email" id="reply_to" required
               class="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3 py-2"
               placeholder="dein.name@example.com" />
      </div>

      <!-- Einverständnis -->
      <div class="flex items-center gap-2">
        <input type="checkbox" id="consent" required class="h-4 w-4">
        <label for="consent" class="text-sm text-neutral-300">
          Ich stimme zu, dass meine Angaben zur Kontaktaufnahme gespeichert und verarbeitet werden.
        </label>
      </div>

      <!-- Absenden -->
      <div>
        <button type="submit"
                class="bg-orange-600 hover:bg-orange-500 text-white font-semibold rounded-full px-6 py-2">
          Nachricht senden
        </button>
      </div>

      <!-- FormSubmit: Erfolg / Fehler -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
    </form>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-800 mt-12">
    <div class="max-w-3xl mx-auto px-4 py-6 text-xs text-neutral-500 flex justify-between">
      <span>© R.A.L.F. – Alle Rechte vorbehalten.</span>
      <span>contact-test</span>
    </div>
  </footer>
</body>
</html>
