<!-- R.A.L.F. – Contact | contact.html v1.4 -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt – R.A.L.F.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#0a0a0a;color:#f5f5f5}
    .orange-sep{height:4px;background:#ea580c}
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Kopf -->
  <header class="p-6 text-center">
    <h1 class="text-3xl font-extrabold">✉️ Kontakt</h1>
    <div class="orange-sep mt-4"></div>
  </header>

  <!-- Formular -->
  <main class="flex-1 max-w-xl mx-auto px-6 py-8">
    <form
      action="https://formsubmit.co/92bdccb093ce67e1c363400b90f37511"
      method="POST"
      class="space-y-4 bg-neutral-900/60 border border-neutral-800 rounded-2xl p-5"
    >
      <!-- Reply-To -->
      <label class="block text-sm">
        Deine E-Mail (Antwortadresse)
        <input type="email" name="email" required
               class="mt-1 w-full rounded-md bg-neutral-800 border border-neutral-700 px-3 py-2"
               placeholder="dein.name@mail.de">
      </label>

      <label class="block text-sm">
        Betreff
        <input type="text" name="subject" required
               class="mt-1 w-full rounded-md bg-neutral-800 border border-neutral-700 px-3 py-2"
               placeholder="Feedback / Fehler / Anfrage">
      </label>

      <label class="block text-sm">
        Nachricht
        <textarea name="message" rows="6" required
                  class="mt-1 w-full rounded-md bg-neutral-800 border border-neutral-700 px-3 py-2"
                  placeholder="Schreib mir hier dein Feedback oder deine Anfrage …"></textarea>
      </label>

      <!-- FormSubmit Optionen -->
      <input type="hidden" name="_subject" value="Neue Nachricht über ralf-music.de">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <!-- nach dem Senden zurück auf Contact-Seite -->
      <input type="hidden" name="_next" value="https://ralf-music.netlify.app/contact.html?success=1">

      <button type="submit"
        class="w-full sm:w-auto rounded-full bg-orange-600 hover:bg-orange-500 px-5 py-2 font-semibold">
        Senden
      </button>

      <!-- Erfolgsmeldung -->
      <div id="ok" class="mt-2 text-sm text-green-400 hidden">
        Danke, deine Nachricht wurde gesendet.
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-800">
    <div class="max-w-4xl mx-auto px-4 py-6 text-xs text-neutral-500 flex justify-between">
      <span>© R.A.L.F. – Alle Rechte vorbehalten.</span>
      <span>contact.html v1.4</span>
    </div>
  </footer>

  <script>
    if (new URLSearchParams(location.search).get('success') === '1') {
      const el = document.getElementById('ok'); 
      if (el) el.classList.remove('hidden');
    }
  </script>
</body>
</html>
