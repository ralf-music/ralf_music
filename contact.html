<!-- R.A.L.F. – Contact Page | contact.html v2.2 -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Kontakt – R.A.L.F.</title>
  <meta name="description" content="Kontaktformular für Feedback und Support zu R.A.L.F. Music." />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-neutral-950 text-neutral-100 flex flex-col">
  <!-- Header -->
  <header class="relative w-full h-[160px] bg-black">
    <img src="/assets/logo-banner.png" alt="R.A.L.F. Banner" class="absolute inset-0 w-full h-full object-fill" />
  </header>

  <main class="flex-1 max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-extrabold mb-6 text-center text-orange-500">Kontakt</h1>

    <p class="text-neutral-300 leading-relaxed mb-8 text-center">
      Gerne könnt ihr mir hier Feedback zu Songs oder zur Webseite mitteilen –
      auch wenn ihr irgendwelche Fehler findet oder Probleme habt.
    </p>

    <!-- Kontaktformular -->
    <form action="https://formsubmit.co/92bdccb093ce67e1c363400b90f37511" method="POST" class="space-y-6 bg-neutral-900/60 p-6 rounded-2xl border border-orange-600">
      <!-- Hidden Config -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="box">
      <input type="hidden" name="_next" value="https://ralf-music.netlify.app/thanks.html">

      <!-- Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-neutral-300">Dein Name</label>
        <input type="text" id="name" name="name" required
               class="mt-1 w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-white placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-orange-500">
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-neutral-300">Deine E-Mail</label>
        <input type="email" id="email" name="email" required
               class="mt-1 w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-white placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-orange-500">
      </div>

      <!-- Betreff -->
      <div>
        <label for="subject" class="block text-sm font-medium text-neutral-300">Betreff</label>
        <select id="subject" name="subject" required
                class="mt-1 w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-orange-500">
          <option value="Bug">Bug / Fehler</option>
          <option value="Feedback">Feedback</option>
          <option value="Anfrage">Allgemeine Anfrage</option>
        </select>
      </div>

      <!-- Song-Auswahl -->
      <div>
        <label for="song" class="block text-sm font-medium text-neutral-300">Bezug auf Song (optional)</label>
        <select id="song" name="song"
                class="mt-1 w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-orange-500">
          <option value="">— kein Song ausgewählt —</option>
        </select>
        <div id="songPreview" class="mt-2 hidden">
          <img id="songCover" src="" alt="Song Cover" class="w-24 h-24 rounded-lg border border-neutral-700">
          <p id="songTitle" class="mt-1 text-sm text-neutral-300"></p>
        </div>
      </div>

      <!-- Nachricht -->
      <div>
        <label for="message" class="block text-sm font-medium text-neutral-300">Nachricht</label>
        <textarea id="message" name="message" rows="5" required
                  class="mt-1 w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-white placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
      </div>

      <!-- Submit -->
      <div class="text-center">
        <button type="submit"
                class="bg-orange-600 hover:bg-orange-500 text-white font-semibold px-6 py-2 rounded-full">
          Nachricht senden
        </button>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-800">
    <div class="max-w-3xl mx-auto px-4 py-6 text-xs text-neutral-500 flex justify-between">
      <span>© R.A.L.F. – Alle Rechte vorbehalten.</span>
      <span>contact.html v2.2</span>
    </div>
  </footer>

  <script>
    // Songs laden und Dropdown + Preview füllen
    fetch('/songs.json')
      .then(r => r.json())
      .then(data => {
        const songs = data.songs || [];
        const sel = document.getElementById('song');
        songs.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.title} – ${s.artist || ''} (${s.category})`;
          opt.dataset.cover = s.cover;
          sel.appendChild(opt);
        });
        sel.addEventListener('change', e => {
          const opt = sel.options[sel.selectedIndex];
          const cover = opt.dataset.cover;
          const title = opt.textContent;
          const prev = document.getElementById('songPreview');
          if (sel.value && cover) {
            document.getElementById('songCover').src = cover;
            document.getElementById('songTitle').textContent = title;
            prev.classList.remove('hidden');
          } else {
            prev.classList.add('hidden');
          }
        });
      });
  </script>
</body>
</html>
